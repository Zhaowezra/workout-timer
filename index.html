<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Workout Timer</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: system-ui, sans-serif; }
      body.phase-work { background: #0a5c1f; }
      body.phase-rest { background: #0b3d91; }
      body.phase-get-ready { background: #7a5200; }
      body.phase-done { background: #222; }
      #app { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1.25rem; padding: 1.5rem; text-align: center; }
      [hidden] { display: none !important; }
      .stepper { display: flex; align-items: center; gap: 0.75rem; }
      .stepper label { width: 6rem; text-align: right; font-size: 1.1rem; }
      .stepper input { width: 5.5rem; height: 4rem; font-size: 2rem; text-align: center; background: #111; color: #fff; border: 2px solid #fff; border-radius: 0.75rem; }
      button { min-width: 4rem; min-height: 4rem; font-size: 1.75rem; font-weight: 700; color: #fff; background: #222; border: 2px solid #fff; border-radius: 0.75rem; padding: 0 1.5rem; }
      button.primary { min-width: 14rem; min-height: 5rem; font-size: 2.25rem; background: #fff; color: #000; }
      #validation-message { color: #ff6b6b; font-size: 1.25rem; min-height: 1.5rem; }
      #countdown { font-size: min(40vw, 40vh); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
      #phase-label { font-size: 3rem; font-weight: 800; letter-spacing: 0.15em; }
      #round-label { font-size: 1.75rem; }
      .hint { opacity: 0.8; }
      .row { display: flex; gap: 1rem; }
    </style>
  </head>
  <body>
    <div id="app">
      <section id="setup-screen" class="screen">
        <h1>Workout Timer</h1>
        <div class="stepper"><label for="rounds-input">Rounds</label><button type="button" data-step-target="rounds-input" data-step-amount="-1" aria-label="Fewer rounds">−</button><input id="rounds-input" type="number" inputmode="numeric" /><button type="button" data-step-target="rounds-input" data-step-amount="1" aria-label="More rounds">+</button></div>
        <div class="stepper"><label for="work-seconds-input">Work (s)</label><button type="button" data-step-target="work-seconds-input" data-step-amount="-5" aria-label="Shorter work">−</button><input id="work-seconds-input" type="number" inputmode="numeric" /><button type="button" data-step-target="work-seconds-input" data-step-amount="5" aria-label="Longer work">+</button></div>
        <div class="stepper"><label for="rest-seconds-input">Rest (s)</label><button type="button" data-step-target="rest-seconds-input" data-step-amount="-5" aria-label="Shorter rest">−</button><input id="rest-seconds-input" type="number" inputmode="numeric" /><button type="button" data-step-target="rest-seconds-input" data-step-amount="5" aria-label="Longer rest">+</button></div>
        <div id="validation-message" role="alert"></div>
        <button id="start-button" class="primary" type="button">Start</button>
        <p class="hint">Keep your screen on: don't lock your phone during the workout.</p>
      </section>
      <section id="running-screen" class="screen" hidden>
        <div id="phase-label"></div>
        <div id="countdown"></div>
        <div id="round-label"></div>
        <div class="row">
          <button id="pause-resume-button" type="button">Pause</button>
          <button id="stop-button" type="button">Stop</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
